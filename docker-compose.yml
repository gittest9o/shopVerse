version: '3.8'

services:
  eureka-server:
    image: eureka-server:latest
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1}
      MYSQL_DATABASE: shop
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - shop-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - shop-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop-network

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - shop-network

  auth-service:
    image: auth-service:latest
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER: eureka-server
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - shop-network

  order-service:
    image: order-service:latest
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      EUREKA_SERVER: eureka-server
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - shop-network

  cart-service:
    image: cart-service:latest
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_SERVER: eureka-server
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - shop-network

  gateway-service:
    image: gateway-service:latest
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    environment:
      EUREKA_SERVER: eureka-server
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - auth-service
      - product-service
      - cart-service
      - order-service
      - user-service
    networks:
      - shop-network

  product-service:
    image: product-service:latest
    build:
      context: ./product-service
      dockerfile: Dockerfile
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      EUREKA_SERVER: eureka-server
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - shop-network

  user-service:
    image: user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      EUREKA_SERVER: eureka-server
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - shop-network

  notification-service:
    image: notification-service:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8086
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: antkatorets@gmail.com
      SPRING_MAIL_PASSWORD: wbwm yolz bsuk mmpv
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shop-network

  # ---------------------------
  # Elasticsearch (added)
  # ---------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---------------------------
  # Admin service (added earlier)
  # ---------------------------
  admin-service:
    image: admin-service:latest
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    ports:
      - "8111:8111"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/

    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - shop-network

  # ---------------------------
  # Search service (ВАШ MICROSERVICE) — добавлен сюда
  # ---------------------------
  search-service:
    image: search-service:latest
    build:
      context: ./elasticsearch-service
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      # заставляем Spring подключаться к контейнеру elasticsearch
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      # пробрасываем Kafka (если сервис использует Kafka)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # порт из вашего конфига
      SERVER_PORT: 8099
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - shop-network
    healthcheck:
      # при наличии actuator: /actuator/health, иначе можно убрать healthcheck
      test: ["CMD-SHELL", "curl -f http://localhost:8099/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      monitoring:
        aliases:
          - grafana

  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/prometheus
    networks:
      monitoring:
        aliases:
          - prometheus
      shop-network:


  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root1
    networks:
      - shop-network

    ports:
      - "8090:8080"
    depends_on:
      - mysql
    command:
      - start-dev

networks:
  shop-network:
    driver: bridge
  monitoring:

volumes:
  mysql-data:
  redis-data:
  esdata:
