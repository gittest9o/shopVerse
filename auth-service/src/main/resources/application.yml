server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  thymeleaf:
    prefix: ${THYMELEAF_PREFIX:classpath:/templates/}
    suffix: ${THYMELEAF_SUFFIX:.html}
    enabled: ${THYMELEAF_ENABLED:true}
    cache: ${THYMELEAF_CACHE:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}

jwt:
  secret: ${JWT_SECRET}
  expiration-period: ${EXPIRATION_PERIOD:PT24H}
