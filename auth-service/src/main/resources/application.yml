server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: auth-service
  profiles:
    active: local

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    enabled: true
    cache: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: ${JWT_SECRET}
