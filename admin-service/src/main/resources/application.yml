spring:
  application:
    name: admin-service

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    enabled: true
    cache: false

server:
  port: 8111

eureka:
  client:
    service-url:
      defaultZone:  http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
